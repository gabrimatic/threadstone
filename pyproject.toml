[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "threadstone"
version = "1.2.1"
description = "Offline terminal chat for local MLX language models on Apple Silicon"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
keywords = ["llm", "mlx", "apple-silicon", "offline", "chat", "terminal", "local-first", "qwen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.optional-dependencies]
runtime = [
    "mlx",
    "mlx-lm",
    "mlx-vlm[torch]",
]
dev = [
    "build",
    "mypy",
    "ruff",
    "twine",
]

[project.scripts]
threadstone = "threadstone:main"
oracle = "threadstone:main"

[project.urls]
Homepage = "https://github.com/gabrimatic/threadstone"
Repository = "https://github.com/gabrimatic/threadstone"
Issues = "https://github.com/gabrimatic/threadstone/issues"
Changelog = "https://github.com/gabrimatic/threadstone/blob/main/CHANGELOG.md"
Security = "https://github.com/gabrimatic/threadstone/security/advisories/new"

[tool.setuptools]
py-modules = ["threadstone", "config"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Terminal glyphs (› ×) are intentional.
ignore = ["RUF001", "RUF003"]

[tool.mypy]
python_version = "3.13"
files = ["config.py", "threadstone.py"]
check_untyped_defs = true
warn_unused_ignores = true
